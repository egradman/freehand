[project]
name = "freehand"
version = "0.1.0"
description = "Apple Siri Remote desktop control: an adaptable reference snapshot"
requires-python = ">=3.14"
dependencies = [
    "dbus-fast>=5.2.0",
]

[project.scripts]
freehand = "freehand:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
