# freehand: start bluetoothd without the HID-over-GATT (hog) plugin, so userspace
# can talk to the Siri Remote's HID service directly (BlueZ otherwise claims it
# and refuses the enable write). Bluetooth LE keyboards/mice won't work while
# this is installed. Undo: sudo rm /etc/systemd/system/bluetooth.service.d/freehand-no-hog.conf
#       && sudo systemctl daemon-reload && sudo systemctl restart bluetooth
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=hog
